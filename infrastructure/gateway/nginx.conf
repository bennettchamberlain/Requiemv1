worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type  application/octet-stream;

  resolver 127.0.0.11 ipv6=off;

  sendfile on;
  server_tokens off;

  # Upgrade connection only when the client requests WebSocket;
  # empty string for normal requests preserves keep-alive.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  # The scheme the CLIENT used, not the one this gateway was reached on.
  #
  # This gateway always listens plain HTTP on 8642; TLS is terminated upstream by
  # Hub Traefik or the Cloudflare tunnel, which set X-Forwarded-Proto: https.
  # Forwarding `$scheme` here would overwrite that with our own "http", and since
  # the API runs `trust proxy 1`, Express would compute `req.secure === false` on
  # every request — so `secure: req.secure` in domains/auth/utils/authCookies.ts
  # issued the 7-day sessionToken and csrfToken WITHOUT the Secure attribute on
  # an origin the user reaches over HTTPS, exposing them to any on-path attacker.
  # (resolveOidcOriginBounce carries a workaround for this same rewrite.)
  #
  # Preserving the inbound value keeps both deployments correct: HTTPS installs
  # get Secure cookies, while a direct plain-HTTP LAN or Tailscale exposure sends
  # no such header, falls through to `$scheme`, and keeps working unencrypted.
  #
  # Normalise to a strict http/https rather than forwarding the client-supplied
  # header verbatim: match only the FIRST token (mirroring how Express derives
  # req.secure from a comma-joined X-Forwarded-Proto) and collapse anything
  # unexpected — junk, empty, or an unparseable chain — to this connection's own
  # $scheme (http here), so a direct client cannot inject an arbitrary value
  # downstream. \b anchors the token end without a `$` that nginx would read as a
  # variable; the https rule is listed first so it wins over the http prefix.
  map $http_x_forwarded_proto $client_proto {
    default        $scheme;
    "~*^https\b"   https;
    "~*^http\b"    http;
  }

  upstream api {
    server api:3030;
    keepalive 8;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Cache-Control "no-cache, no-store, must-revalidate";
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src * data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

  server {
    listen 8642;
    server_name _;

    location /api/llm/generate {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $client_proto;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/api/(.*)$ /$1 break;

      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_set_header X-Accel-Buffering no;

      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      client_max_body_size 10G;
      sendfile on;
    }

    # MCP Streamable HTTP – POST responses and GET streams may use SSE
    location ~ ^/api/mcp(/?)$ {
      proxy_pass http://api;
      rewrite ^/api/(.*)$ /$1 break;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $client_proto;

      # Disable buffering so streamed responses arrive immediately
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_set_header X-Accel-Buffering no;

      # Long timeouts for SSE notification streams (GET) and tool calls
      proxy_read_timeout 86400s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 86400s;
    }

    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $client_proto;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/api/(.*)$ /$1 break;

      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      client_max_body_size 10G;
      sendfile on;
    }

    location /static/ {
      # Prevent SDK credentials on NGINX proxy.
      # These should only be allowed from the web application.
      if ($http_authorization != "") {
        return 403;
      }

      proxy_pass http://object-store:9000;
      proxy_set_header Host object-store:9000;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/static/(.*)$ /$1 break;

      # Optimize performance with browser caching
      # NOTE: add_header in a location block replaces (not merges) inherited headers,
      #       so security headers from the http{} block must be repeated here.
      add_header Cache-Control "private, max-age=60, immutable";
      add_header X-Content-Type-Options nosniff always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src * data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

      # Allow large files to be proxied without buffering (sends file as stream)
      proxy_request_buffering off;
      proxy_buffering off;

      # Increase timeouts for slow clients or large files
      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      # Optionally increase the size of the initial buffer (tune as needed)
      client_max_body_size 10G; # Allows uploads up to 10GB (set as you need)
      sendfile on;
    }

    location /assets/ {
      root /usr/share/nginx/html/ci/web;

      try_files $uri = 404;

      add_header Cache-Control "public, max-age=604800, immutable";
      add_header X-Content-Type-Options nosniff always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src * data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    }

    location / {
      root /usr/share/nginx/html/ci/web;

      try_files $uri $uri/ /index.html;
    }
  }
}
