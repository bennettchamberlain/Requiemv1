name: Publish

on:
  push:
    tags:
      - '*'

# Only one publish run at a time per tag.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to CI-Portal
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ${{ vars.REGISTRY || 'ghcr.io/companionintelligence' }}
      PORTAL_API: ${{ vars.DEV_PORTAL_API }}
      STORE_ADMIN_API_KEY: ${{ secrets.DEV_STORE_ADMIN_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve VERSION from tag
        run: |
          # github.ref looks like 'refs/tags/v1.2.3' or 'refs/tags/1.2.3'.
          # Strip the refs/tags/ prefix and any leading 'v'.
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "Resolved VERSION=${version} from tag ${tag}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Run publish script
        run: ./scripts/publish/publish.sh

