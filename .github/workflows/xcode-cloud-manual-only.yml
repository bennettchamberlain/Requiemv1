name: Xcode Cloud — delete workflows

# Xcode Cloud (`App | BuildTestFlight`) is NOT a GitHub Actions workflow. It is
# an App Store Connect workflow whose start conditions fire on GitHub pull
# requests, which is why every PR grows a red "App | BuildTestFlight | Build - iOS"
# check and burns an Xcode Cloud mac.
#
# GitHub Actions already never does that: `mobile-release.yml` is the only
# TestFlight lane, and it is workflow_dispatch + `ios-v*` / `mobile-release-v*`
# tags. This workflow exists to delete those App Store Connect workflows via
# API so they stop reporting on PRs.
#
# Run once after the APPSTORE_* secrets are on the repo (they are not today):
#   gh workflow run "Xcode Cloud — delete workflows" --ref main
#
# Until then, delete App | BuildTestFlight in App Store Connect → Xcode Cloud →
# Manage Workflows. Safe to re-run; already-gone products log and exit 0.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete-workflows:
    name: Delete Xcode Cloud workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require App Store Connect API key
        id: secrets
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          if [ -z "$ISSUER" ] || [ -z "$KEY_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::APPSTORE_ISSUER_ID / APPSTORE_KEY_ID / APPSTORE_PRIVATE_KEY are not set. Add them under repo secrets, or delete App | BuildTestFlight in App Store Connect → Xcode Cloud → Manage Workflows."
            exit 1
          fi

      - name: Delete Xcode Cloud workflows
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: node .github/scripts/xcode-cloud-disable-auto-starts.mjs
