services:
  database:
    environment:
      PASSWORD: ${DATABASE_ADMIN_PASSWORD}
    ports:
      - 5432:5432

  gateway:
    image: nginx:stable
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./infrastructure/dev-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/dev-gateway/ssl/:/etc/nginx/ssl/:ro
    networks:
      - ci
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    profiles: [ "local" ]

  object-store:
    environment:
      USERNAME: ${OBJECT_STORE_USERNAME}
      PASSWORD: ${OBJECT_STORE_PASSWORD}
    ports:
      - 9000:9000

  orchestrator:
    environment:
      DATABASE_PASSWORD: ${ORCHESTRATOR_DATABASE_PASSWORD}
    ports:
      - 7233:7233

  stt-service:
    ports:
      - 9001:9001

  summary-service:
    ports:
      - 8001:8001

  tts-service:
    ports:
      - 9002:9002

  #############
  # EPHEMERAL #
  #############

  setup-database:
    environment:
      ADMIN_PASSWORD: ${DATABASE_ADMIN_PASSWORD}
      COMPANION_PASSWORD: ${DATABASE_PASSWORD}
      ORCHESTRATOR_PASSWORD: ${ORCHESTRATOR_DATABASE_PASSWORD}

  setup-orchestrator:
    environment:
      DATABASE_PASSWORD: ${ORCHESTRATOR_DATABASE_PASSWORD}
