services:
  database:
    environment:
      PASSWORD: ${DATABASE_ADMIN_PASSWORD}
    ports:
      - 5432:5432

  gateway:
    image: nginx:stable
    ports:
      - 8642:8642
    volumes:
      - ./infrastructure/dev-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ci
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    profiles: [ "local" ]

  object-store:
    environment:
      USERNAME: ${OBJECT_STORE_USERNAME}
      PASSWORD: ${OBJECT_STORE_PASSWORD}
    ports:
      - 9000:9000

  orchestrator:
    environment:
      DATABASE_PASSWORD: ${ORCHESTRATOR_DATABASE_PASSWORD}
    ports:
      - 7233:7233

  stt-service:
    ports:
      - 9001:9001

  summary-service:
    ports:
      - 8001:8001
    environment:
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}

  hbpe-service:
    ports:
      - 8003:8003
    environment:
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}

  tts-service:
    ports:
      - 9002:9002

  #############
  # EPHEMERAL #
  #############

  setup-database:
    environment:
      ADMIN_PASSWORD: ${DATABASE_ADMIN_PASSWORD}
      COMPANION_PASSWORD: ${DATABASE_PASSWORD}
      ORCHESTRATOR_PASSWORD: ${ORCHESTRATOR_DATABASE_PASSWORD}

  setup-orchestrator:
    environment:
      DATABASE_PASSWORD: ${ORCHESTRATOR_DATABASE_PASSWORD}

  hbpe-service:
    build:
      context: ./backend/apps/hbpe
      dockerfile: Dockerfile.local
    image: ci/hbpe-service-local
    pull_policy: build
    environment:
      - PYTHONPATH=/app/src
      - DATABASE_URL=postgresql://companion:${DATABASE_PASSWORD}@database:5432/companion
      - TEMPORAL_ADDRESS=orchestrator:7233
      - TEMPORAL_NAMESPACE=default
      - HBPE_TASK_QUEUE=hbpe
      - MODELS_DIR=/app/models
      - TOKEN_CORPUS_DIR=/app/data/token_corpus
      - HF_HOME=/app/models/hf_cache
      - API_URL=http://host.docker.internal:3000
      - API_JWT_SECRET=${AUTH_JWT_AUTHTOKENSECRET}
    volumes:
      - hbpe-models:/app/models
      - hbpe-corpus:/app/data
    networks:
      - ci
    depends_on:
      - database
      - orchestrator
    restart: unless-stopped
    ports:
      - 8002:8002
    profiles: [ "local" ]
