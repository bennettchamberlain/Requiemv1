# Workspace member. Dependencies resolve through the single uv.lock at the
# repo root, not a lock of this service's own. See the root pyproject.toml
# for the naming and layout conventions.

[project]
name = "ci-hbpe"
version = "0.1.0"
description = "CI-HBPE: Hierarchical Behavioral Prediction Engine"
requires-python = ">=3.11"
dependencies = [
    # ── LLM labeling (Qwen3-0.8B Q4_K_M GGUF via llama-cpp-python) ──────────
    # llama-cpp-python is installed in the Dockerfile with hardware-specific
    # build flags (Metal / HIPBLAS). It cannot move here: uv has no way to set
    # per-package build environment variables, and the fork needs CMAKE_ARGS.
    # huggingface_hub handles model download/caching.
    "huggingface_hub>=0.22",

    # ── Model training & calibration ──────────────────────────────────────────
    "torch>=2.2",
    "scikit-learn>=1.4",             # ECE calibration in model/calibration.py
    "onnx>=1.16",                    # Required by onnxruntime.quantization
    "onnxscript>=0.1",               # Required by torch.onnx.export (torch 2.x)

    # INT8 quantized inference (Phase 4). onnxruntime-gpu publishes wheels
    # only for linux-x86_64 and win-amd64, so it cannot be an unconditional
    # dependency: a workspace resolves for every member on every platform,
    # and an unmarked entry fails `uv sync` outright on Apple Silicon and on
    # aarch64 image builds. The markers below are what the hbpe Dockerfile
    # used to fake with `sed -i 's/onnxruntime-gpu/onnxruntime/'`.
    "onnxruntime-gpu>=1.17; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnxruntime>=1.17; sys_platform != 'linux' or platform_machine != 'x86_64'",

    # ── Data I/O ──────────────────────────────────────────────────────────────
    "psycopg2-binary>=2.9",         # PostgreSQL / TimescaleDB access
    "asyncpg>=0.29",                # async LISTEN/NOTIFY ingester (event-driven cache invalidation)

    # ── Workflow orchestration ────────────────────────────────────────────────
    "temporalio",                    # nightly job Temporal workflows

    # ── App GraphQL client ────────────────────────────────────────────────────
    "requests>=2.31",               # HTTP for GraphQL calls to application service
    "PyJWT>=2.13.0",                 # self-sign service JWTs with shared secret

    # ── API & config ──────────────────────────────────────────────────────────
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "python-dotenv",

    # ── Error reporting ───────────────────────────────────────────────────────
    # Inert unless SENTRY_DSN is set. The telemetry module also tolerates the
    # package being absent so a slimmed install still boots.
    "sentry-sdk>=2.20",

    # ── Utilities ────────────────────────────────────────────────────────────
    "structlog",
    "numpy",
]

# The test runner and linters come from the root workspace dev group, so
# they are not repeated here.

[tool.uv.build-backend]
module-name = "ci.hbpe"
namespace = true

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
