[project]
name = "ci-parser"
version = "1.0.0"
description = "CI-Parser: Async document extraction service using MarkItDown"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi",
    "uvicorn",
    "python-multipart",

    # Document extraction
    "markitdown[all]",

    # Configuration
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
