services:
  api:
    image: ci/api
    env_file:
      - .env
    environment:
      DATABASE_HOST: database
      OBJECT_STORE_URL: http://object-store:9000
      OLLAMA_HOST: http://host.docker.internal:11434
      STT_HOST: http://stt-service:9001
      TTS_HOST: http://tts-service:9002
      HBPE_HOST: http://hbpe-service:8002
    networks:
      - ci
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      migrate-database:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    restart: unless-stopped
    profiles: [ "staging" ]

  database:
    environment:
      PASSWORD: ${DATABASE_ADMIN_PASSWORD}
    ports:
      - 5432:5432

  gateway:
    image: ci/gateway
    ports:
      - 8642:8642
    volumes:
      - ./infrastructure/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ci
    restart: unless-stopped
    profiles: [ "staging" ]

  object-store:
    environment:
      USERNAME: ${OBJECT_STORE_USERNAME}
      PASSWORD: ${OBJECT_STORE_PASSWORD}
    ports:
      - 9000:9000

  orchestrator:
    environment:
      DATABASE_PASSWORD: ${ORCHESTRATOR_DATABASE_PASSWORD}

  summary-service:
    environment:
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}

  hbpe-service:
    environment:
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video

  #############
  # EPHEMERAL #
  #############

  migrate-database:
    image: ci/api
    env_file:
      - .env
    environment:
      DATABASE_HOST: database
    networks:
      - ci
    command: ["yarn", "migrate"]
    restart: "no"
    depends_on:
      setup-database:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    profiles: [ "staging" ]

  setup-database:
    environment:
      ADMIN_PASSWORD: ${DATABASE_ADMIN_PASSWORD}
      COMPANION_PASSWORD: ${DATABASE_PASSWORD}
      ORCHESTRATOR_PASSWORD: ${ORCHESTRATOR_DATABASE_PASSWORD}

  setup-orchestrator:
    environment:
      DATABASE_PASSWORD: ${ORCHESTRATOR_DATABASE_PASSWORD}
