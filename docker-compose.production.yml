services:
  api:
    image: ci/api
    volumes:
      - secrets:/run/secrets:ro
    networks:
      - ci
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      generate-secrets:
        condition: service_completed_successfully
      migrate-database:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    restart: unless-stopped
    profiles: [ "production" ]

  database:
    volumes:
      - secrets:/run/secrets:ro
    depends_on:
      generate-secrets:
        condition: service_completed_successfully

  gateway:
    image: ci/gateway
    ports:
      - 8642:8642
    volumes:
      - ./infrastructure/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ci
    restart: unless-stopped
    profiles: [ "production" ]

  object-store:
    volumes:
      - secrets:/run/secrets:ro
    depends_on:
      generate-secrets:
        condition: service_completed_successfully

  orchestrator:
    volumes:
      - secrets:/run/secrets:ro
    depends_on:
      generate-secrets:
        condition: service_completed_successfully

  summary-service:
    volumes:
      - secrets:/run/secrets:ro
    depends_on:
      generate-secrets:
        condition: service_completed_successfully

  #############
  # EPHEMERAL #
  #############

  generate-secrets:
    image: ci/setup-secrets
    restart: "no"
    volumes:
      - secrets:/run/secrets
    profiles: [ "production" ]

  migrate-database:
    image: ci/api
    volumes:
      - secrets:/run/secrets:ro
    networks:
      - ci
    command: ["yarn", "migrate"]
    restart: "no"
    depends_on:
      generate-secrets:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    profiles: [ "production" ]

  setup-database:
    volumes:
      - secrets:/run/secrets:ro

  setup-orchestrator:
    volumes:
      - secrets:/run/secrets:ro
